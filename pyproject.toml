[project]
name = "Integration-tests"
version = "0.1.0"
description = "Integration tests for the PTSS-Support app microservices"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"